[project]
name = "edgewise"
version = "0.1.0"
description = "On-device LLM inference toolkit: benchmark quantized models, accelerate decoding, and route to the cloud only when needed."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tanisha Karmakar" }]
keywords = ["llm", "inference", "edge-ai", "quantization", "speculative-decoding", "mlx", "llama-cpp"]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "duckdb>=1.1",
    "httpx>=0.27",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
mlx = ["mlx-lm"]
cloud = ["anthropic>=1.0"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
edgewise = "edgewise.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgewise"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer declares CLI options as call defaults by design

[tool.ruff.lint.per-file-ignores]
"src/edgewise/report/svg.py" = ["E501"]  # long SVG markup strings

[tool.pytest.ini_options]
testpaths = ["tests"]
