<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img">
<title>Local-first routing: quality vs. how much stays on the device</title>
<desc>Line chart of mean task score against the share of requests answered locally, as the escalation confidence threshold varies.</desc>
<style>
:root {
  --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --deemph: #c3c2b7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --deemph: #52514e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  }
}
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: var(--ink2); }
.title { font-size: 15px; font-weight: 600; fill: var(--ink); }
.strong { fill: var(--ink); font-weight: 600; }
.muted { fill: var(--muted); }
.tick { fill: var(--muted); font-variant-numeric: tabular-nums; }
.bg { fill: var(--surface); }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.line { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ring { stroke: var(--surface); stroke-width: 2; }
.s1 { fill: var(--s1); } .s2 { fill: var(--s2); } .s3 { fill: var(--s3); }
.deemph { fill: var(--deemph); }
</style>
<rect class="bg" width="720" height="400" rx="8"/>
<text class="title" x="24" y="30">Local-first routing: quality vs. how much stays on the device</text>
<text x="24" y="50">qwen2.5-1.5b 4bit answers first; unsure answers escalate to qwen2.5-3b 4bit.</text>
