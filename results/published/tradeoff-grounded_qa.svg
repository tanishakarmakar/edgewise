<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img">
<title>Quality vs. speed: grounded_qa</title>
<desc>Scatter plot of task score against decoding speed for 8 model variants on the grounded_qa task. 2 are on the Pareto frontier.</desc>
<style>
:root {
  --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --deemph: #c3c2b7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --deemph: #52514e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  }
}
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: var(--ink2); }
.title { font-size: 15px; font-weight: 600; fill: var(--ink); }
.strong { fill: var(--ink); font-weight: 600; }
.muted { fill: var(--muted); }
.tick { fill: var(--muted); font-variant-numeric: tabular-nums; }
.bg { fill: var(--surface); }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.line { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ring { stroke: var(--surface); stroke-width: 2; }
.s1 { fill: var(--s1); } .s2 { fill: var(--s2); } .s3 { fill: var(--s3); }
.deemph { fill: var(--deemph); }
</style>
<rect class="bg" width="720" height="430" rx="8"/>
<text class="title" x="24" y="30">Quality vs. speed: grounded_qa</text>
<text x="24" y="50">Each dot is one model variant measured on this device. Up and to the right is better.</text>
<circle class="s1" cx="30" cy="70" r="5"/><text x="42" y="74">Worth considering (nothing else is both faster and better)</text>
<circle class="deemph" cx="431" cy="70" r="5"/><text x="443" y="74">Beaten by another model</text>
<line class="grid" x1="56" x2="692" y1="378.0" y2="378.0"/>
<text class="tick" x="48" y="382.0" text-anchor="end">0</text>
<line class="grid" x1="56" x2="692" y1="325.6" y2="325.6"/>
<text class="tick" x="48" y="329.6" text-anchor="end">0.2</text>
<line class="grid" x1="56" x2="692" y1="273.2" y2="273.2"/>
<text class="tick" x="48" y="277.2" text-anchor="end">0.4</text>
<line class="grid" x1="56" x2="692" y1="220.8" y2="220.8"/>
<text class="tick" x="48" y="224.8" text-anchor="end">0.6</text>
<line class="grid" x1="56" x2="692" y1="168.4" y2="168.4"/>
<text class="tick" x="48" y="172.4" text-anchor="end">0.8</text>
<line class="grid" x1="56" x2="692" y1="116.0" y2="116.0"/>
<text class="tick" x="48" y="120.0" text-anchor="end">1</text>
<text class="tick" x="56.0" y="396" text-anchor="middle">0</text>
<text class="tick" x="268.0" y="396" text-anchor="middle">50</text>
<text class="tick" x="480.0" y="396" text-anchor="middle">100</text>
<text class="tick" x="692.0" y="396" text-anchor="middle">150</text>
<line class="axis" x1="56" x2="692" y1="378" y2="378"/>
<text class="muted" x="374" y="418" text-anchor="middle">Speed (tokens per second)</text>
<text class="muted" x="16" y="94">Task score</text>
<circle class="deemph ring" cx="174.0" cy="132.4" r="5"><title>qwen2.5-1.5b 8bit: score 0.94, 28 tokens/s</title></circle>
<circle class="deemph ring" cx="166.2" cy="132.4" r="5"><title>qwen2.5-3b 4bit: score 0.94, 26 tokens/s</title></circle>
<circle class="deemph ring" cx="238.6" cy="134.7" r="5"><title>qwen2.5-1.5b 4bit: score 0.93, 43 tokens/s</title></circle>
<circle class="deemph ring" cx="298.8" cy="140.6" r="5"><title>llama3.2-1b 4bit: score 0.91, 57 tokens/s</title></circle>
<circle class="deemph ring" cx="207.9" cy="140.6" r="5"><title>llama3.2-1b 8bit: score 0.91, 36 tokens/s</title></circle>
<circle class="deemph ring" cx="374.6" cy="165.1" r="5"><title>qwen2.5-0.5b 8bit: score 0.81, 75 tokens/s</title></circle>
<polyline class="line" style="stroke-opacity:.35" points="151.8,116.0 576.0,132.4"/>
<circle class="s1 ring" cx="151.8" cy="116.0" r="6"><title>llama3.2-3b 4bit: score 1.00, 23 tokens/s</title></circle>
<circle class="s1 ring" cx="576.0" cy="132.4" r="6"><title>qwen2.5-0.5b 4bit: score 0.94, 123 tokens/s</title></circle>
<text class="strong" x="566.0" y="124.4" text-anchor="end">qwen2.5-0.5b 4bit (recommended)</text>
<text x="161.8" y="108.0" text-anchor="start">llama3.2-3b 4bit</text>
</svg>
