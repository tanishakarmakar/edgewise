# Edgewise model catalog: every variant the bench and advisor know about.
#
# Architecture numbers (layers, KV heads, head dim) come from each model's config.json and feed the
# memory estimate in edgewise/catalog.py. bits_per_weight is the *effective* size including
# quantization scales: MLX affine quantization with group size 64 stores an fp16 scale and bias per
# group, adding 0.5 bits per weight.

# ---------------------------------------------------------------- Qwen 2.5 Instruct

