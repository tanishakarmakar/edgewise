id = "qwen2.5-0.5b-instruct@mlx-4bit"
family = "qwen2.5"
params_b = 0.49
quant = "mlx-4bit"
bits_per_weight = 4.5
backend = "mlx"
source = "mlx-community/Qwen2.5-0.5B-Instruct-4bit"
tokenizer_family = "qwen2.5"
n_layers = 24
n_kv_heads = 2
head_dim = 64
