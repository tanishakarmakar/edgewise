name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # MLX is Apple-only and not needed: tests use a fake backend and a stand-in API client.
      - run: uv sync --extra cloud --extra serve
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
